<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverstone 2026 — scroll the race</title>
<style>
  :root{
    --bg:#101116; --card:#181A21; --line:#2A2D38; --ink:#EDEEF2;
    --muted:#9BA0AE; --amber:#F5A623; --road:#1D1F27; --roadline:#3A3E4D;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif; line-height:1.5;}

  /* HUD */
  .hud{position:fixed; top:0; left:0; right:0; z-index:50; display:flex;
    justify-content:space-between; align-items:center; padding:12px 18px;
    background:linear-gradient(#101116f2,#10111600); pointer-events:none;}
  .hud .gp{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);}
  .hud .gp b{color:var(--amber);}
  .lapbox{text-align:right; font-family:Consolas,monospace;}
  .lapbox .n{font-size:26px; font-weight:700; color:var(--amber); font-variant-numeric:tabular-nums;}
  .lapbox .of{font-size:11px; color:var(--muted); letter-spacing:.1em;}
  .pbar{position:fixed; top:0; left:0; height:3px; background:var(--amber); z-index:60; width:0%;}

  /* track + car */
  #roadsvg{position:absolute; top:0; left:0; z-index:0; pointer-events:none;}
  #car{position:absolute; z-index:5; width:34px; height:60px; margin:-30px 0 0 -17px;
    pointer-events:none; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));}

  /* content */
  .flow{position:relative; z-index:10; max-width:520px; margin:0 auto;
    padding:96px 18px 60px; display:flex; flex-direction:column;}
  .spacer{height:46vh; flex:none;}
  .card{background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter:blur(4px); border:1px solid var(--line); border-radius:16px;
    padding:22px 22px 20px; box-shadow:0 14px 34px rgba(0,0,0,.35);
    opacity:0; transform:translateY(28px); transition:opacity .5s ease, transform .5s ease;}
  .card.seen{opacity:1; transform:none;}
  .kicker{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--amber); font-weight:600; display:block; margin-bottom:8px;}
  h2{font-family:"Arial Narrow","Segoe UI",sans-serif; text-transform:uppercase;
    font-size:27px; line-height:1.07; margin:0 0 10px; text-wrap:balance;}
  .card p{font-size:15px; color:#C9CCD6; margin:0;}
  .opts{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .chip{border:1px solid #3A3E4D; background:#1B1D26; color:var(--ink); border-radius:99px;
    padding:12px 16px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit; text-align:left;}
  .chip:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  .chip.right{border-color:#4CC38A; color:#4CC38A;}
  .chip.wrong{border-color:#E5484D; color:#E5484D; text-decoration:line-through;}
  .verdict{font-family:Consolas,monospace; font-size:12.5px; color:var(--amber);
    margin-top:10px; display:none;}
  .dato{background:#14161D; border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-top:12px; display:none;}
  .dato.open{display:block;}
  .dato b{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber);}
  .dato table{width:100%; border-collapse:collapse; margin-top:6px;
    font-family:Consolas,monospace; font-size:13px; font-variant-numeric:tabular-nums;}
  .dato td{padding:3px 0; border-bottom:1px solid #232633;}
  .dato td:last-child{text-align:right; color:var(--amber);}
  .peek{margin-top:12px; font-size:11px; letter-spacing:.1em; color:var(--muted);
    cursor:pointer; background:none; border:none; font-family:inherit; padding:0;}
  .peek:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  .finish{height:14px; margin:40px -18px 0;
    background:repeating-conic-gradient(#EDEEF2 0 25%, #101116 0 50%) 0 0/14px 14px;}
  .credits{text-align:center; color:var(--muted); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; padding:26px 0 40px;}
  @media (prefers-reduced-motion: reduce){
    .card{transition:none; opacity:1; transform:none;}
  }
</style>
</head>
<body>
<div class="pbar" id="pbar"></div>
<div class="hud">
  <div class="gp"><b>British GP</b> · Silverstone · sneak peek, phase 1 data</div>
  <div class="lapbox"><span class="n" id="lapnum">0</span><br><span class="of">OF 52 LAPS</span></div>
</div>

<svg id="roadsvg"><path id="road" fill="none"></path><path id="midline" fill="none"></path></svg>
<svg id="car" viewBox="0 0 34 60" aria-hidden="true">
  <rect x="1"  y="2"  width="32" height="6" rx="2" fill="#F5A623"/>
  <rect x="13" y="6"  width="8"  height="46" rx="4" fill="#F5A623"/>
  <rect x="3"  y="12" width="8"  height="12" rx="3" fill="#0C0D12" stroke="#3A3E4D"/>
  <rect x="23" y="12" width="8"  height="12" rx="3" fill="#0C0D12" stroke="#3A3E4D"/>
  <rect x="3"  y="40" width="8"  height="12" rx="3" fill="#0C0D12" stroke="#3A3E4D"/>
  <rect x="23" y="40" width="8"  height="12" rx="3" fill="#0C0D12" stroke="#3A3E4D"/>
  <rect x="9"  y="26" width="16" height="14" rx="4" fill="#C9820A"/>
  <circle cx="17" cy="24" r="4" fill="#0C0D12"/>
  <rect x="4"  y="52" width="26" height="6" rx="2" fill="#F5A623"/>
</svg>

<div class="flow" id="flow"></div>

<script src="story_data.js"></script>
<script>
(function () {
  const cards = window.STORY.cards;
  const TOTAL = window.STORY.laps;
  const flow = document.getElementById('flow');

  // ---------- build cards ----------
  cards.forEach((c, i) => {
    if (i > 0) flow.insertAdjacentHTML('beforeend', '<div class="spacer"></div>');
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.lap = c.lap ?? 0;
    let html = `<span class="kicker">${c.kicker || ''}</span><h2>${c.title || ''}</h2>`;
    if (c.text) html += `<p>${c.text}</p>`;
    if (c.type === 'prediction' && c.options) {
      html += '<div class="opts">' + c.options.map(o =>
        `<button class="chip" data-pick="${o}">${o}</button>`).join('') + '</div>' +
        `<div class="verdict">Locked in. The answer is waiting on lap 1... keep scrolling.</div>`;
    }
    if (c.dato) {
      const rows = c.dato.rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
      html += `<button class="peek">▼ THE DATA BEHIND THIS</button>
               <div class="dato"><b>${c.dato.label}</b><table>${rows}</table></div>`;
    }
    if (c.type === 'share') html += `<div class="opts"><button class="chip">📤 Send it to the group chat</button></div>`;
    div.innerHTML = html;
    flow.appendChild(div);
  });
  flow.insertAdjacentHTML('beforeend',
    '<div class="finish"></div><div class="credits">Generated from real OpenF1 data · texts v1, still cooking</div>');

  // prediction + data-peek interactions
  flow.querySelectorAll('.chip[data-pick]').forEach(b => b.addEventListener('click', e => {
    const card = e.target.closest('.card');
    const answer = cards.find(c => c.type === 'prediction').answer;
    card.querySelectorAll('.chip[data-pick]').forEach(x => {
      x.classList.add(x.dataset.pick === answer ? 'right' : 'wrong');
      x.disabled = true;
    });
    card.querySelector('.verdict').style.display = 'block';
  }));
  flow.querySelectorAll('.peek').forEach(b => b.addEventListener('click', e => {
    e.target.nextElementSibling.classList.toggle('open');
  }));

  // card entrance
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) en.target.classList.add('seen');
  }), { threshold: 0.25 });
  document.querySelectorAll('.card').forEach(c => io.observe(c));

  // ---------- the road + the car ----------
  const svg = document.getElementById('roadsvg');
  const road = document.getElementById('road');
  const mid = document.getElementById('midline');
  const car = document.getElementById('car');
  let samples = [];

  function buildRoad() {
    const H = document.documentElement.scrollHeight;
    const W = document.documentElement.clientWidth;
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    const cx = W / 2, amp = Math.min(W * 0.30, 230), seg = 620;
    let d = `M ${cx} 0`, y = 0, side = 1;
    while (y < H) {
      const y2 = Math.min(y + seg, H);
      d += ` C ${cx + amp * side} ${y + seg * 0.35}, ${cx + amp * side} ${y2 - seg * 0.35}, ${cx} ${y2}`;
      y = y2; side = -side;
    }
    road.setAttribute('d', d); mid.setAttribute('d', d);
    road.setAttribute('stroke', 'var(--road)'); road.setAttribute('stroke-width', 58);
    mid.setAttribute('stroke', 'var(--roadline)'); mid.setAttribute('stroke-width', 2.5);
    mid.setAttribute('stroke-dasharray', '16 20');
    const len = road.getTotalLength();
    samples = [];
    for (let i = 0; i <= len; i += 5) samples.push(road.getPointAtLength(i));
  }

  function pointAtY(y) {
    let lo = 0, hi = samples.length - 1;               // path Y is monotonic
    while (lo < hi) { const m = (lo + hi) >> 1; samples[m].y < y ? lo = m + 1 : hi = m; }
    const p = samples[lo], q = samples[Math.min(lo + 2, samples.length - 1)];
    return { p, angle: Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + 90 };
  }

  // lap counter: interpolate between card anchors
  const anchors = [...document.querySelectorAll('.card')]
    .map(c => ({ el: c, lap: +c.dataset.lap }));

  function onScroll() {
    const maxY = document.documentElement.scrollHeight - innerHeight;
    const prog = maxY ? Math.min(1, scrollY / maxY) : 0;
    document.getElementById('pbar').style.width = (prog * 100) + '%';

    const carDocY = scrollY + innerHeight * 0.42;
    if (samples.length) {
      const { p, angle } = pointAtY(carDocY);
      car.style.left = p.x + 'px';
      car.style.top = p.y + 'px';
      car.style.transform = `rotate(${angle}deg)`;
    }
    // lap: piecewise between anchor cards by their document position
    let lap = 0;
    for (let i = 0; i < anchors.length; i++) {
      const y = anchors[i].el.offsetTop;
      const next = anchors[i + 1];
      if (!next || carDocY < next.el.offsetTop) {
        if (next) {
          const t = Math.max(0, Math.min(1,
            (carDocY - y) / (next.el.offsetTop - y)));
          lap = anchors[i].lap + t * (next.lap - anchors[i].lap);
        } else lap = anchors[i].lap;
        if (carDocY >= y) break;
      }
    }
    document.getElementById('lapnum').textContent = Math.max(0, Math.round(lap));
  }

  buildRoad(); onScroll();
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', () => { buildRoad(); onScroll(); });
})();
</script>
</body>
</html>
