<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverstone 2026 — scroll the race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --carbon-0:#0A0B0E; --carbon-1:#111318; --carbon-2:#1A1D24;
    --line:#272B33; --ink:#F2F3F5; --muted:#8B919D;
    --accent:#E10600; --purple:#A855F7; --green:#22C55E; --yellow:#EAB308;
    --display:"Barlow Condensed","Arial Narrow",sans-serif;
    --body:"Inter","Segoe UI",sans-serif;
    --mono:"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--carbon-0); color:var(--ink);
    font-family:var(--body); line-height:1.55; font-size:15px; overflow-x:hidden;}

  /* ---------- HUD ---------- */
  .hud{position:fixed; top:0; left:0; right:0; z-index:50; display:flex;
    justify-content:space-between; align-items:stretch; pointer-events:none;
    background:linear-gradient(#0A0B0Ef5 55%,#0A0B0E00);}
  .badge{display:flex; align-items:center; gap:12px; padding:14px 18px;}
  .badge .flag{width:4px; align-self:stretch; background:var(--accent);}
  .badge .t1{font-family:var(--display); font-weight:700; font-size:19px;
    letter-spacing:.04em; text-transform:uppercase; line-height:1;}
  .badge .t2{font-family:var(--mono); font-size:10px; color:var(--muted);
    letter-spacing:.14em; text-transform:uppercase; margin-top:4px;}
  .lapbox{display:flex; align-items:center; padding:14px 18px; gap:10px;}
  .lapbox .lbl{font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.14em;}
  .lapbox .n{font-family:var(--mono); font-weight:700; font-size:24px;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
  .lapbox .n small{font-size:13px; color:var(--muted); font-weight:500;}
  .pbar{position:fixed; top:0; left:0; height:2px; background:var(--accent); z-index:60; width:0%;}

  /* ---------- the circuit IS the stage ---------- */
  .trackwrap{position:fixed; z-index:1; pointer-events:none;
    left:50%; top:50%; transform:translate(-50%,-50%);}
  .trackwrap svg{width:100%; height:auto; display:block;}
  .trackcap{position:fixed; bottom:14px; right:16px; z-index:2;
    font-family:var(--mono); font-size:9px; letter-spacing:.16em;
    text-transform:uppercase; color:#565B66;}
  @media (min-width:1100px){ .trackwrap{width:min(80vw,100vh);} }
  @media (max-width:1099px){ .trackwrap{width:min(120vw,90vh); opacity:.55;} }

  /* ---------- flow / stops ---------- */
  .flow{position:relative; z-index:10; max-width:760px; margin:0 auto;
    padding:14vh 20px 60px; display:flex; flex-direction:column;}
  .spacer{height:64vh; flex:none;}
  .stop{position:relative;}
  .stop .card{max-width:380px;}
  @media (min-width:1100px){
    .flow{max-width:none; padding-left:3vw; padding-right:3vw;}
    .stop.s-left  .card{margin-right:auto;}
    .stop.s-right .card{margin-left:auto;}
  }
  @media (max-width:1099px){ .stop .card{margin:0 auto;} }

  /* giant lap numeral behind each stop (typography at extremes) */
  .biglap{position:absolute; top:-0.62em; z-index:0; pointer-events:none;
    font-family:var(--display); font-weight:700; font-size:150px; line-height:1;
    color:transparent; -webkit-text-stroke:1px #30343E; letter-spacing:-.03em;
    user-select:none;}
  .stop.s-left .biglap{right:0;} .stop.s-right .biglap{left:0;}
  @media (max-width:1099px){ .biglap{font-size:110px; left:auto; right:0;} }

  /* ---------- base card ---------- */
  .card{position:relative; z-index:1;
    background:var(--carbon-1);
    border:1px solid var(--line); border-radius:6px;
    padding:18px 20px 16px; box-shadow:0 10px 28px rgba(0,0,0,.45);
    opacity:0; transform:translateY(20px);
    transition:opacity .4s ease-out, transform .4s ease-out;}
  .card.seen{opacity:1; transform:none;}
  .card.seen.dim{opacity:.4;}
  .kicker{display:flex; align-items:center; gap:8px; margin-bottom:10px;
    font-family:var(--mono); font-size:10px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--muted);}
  .kicker::before{content:""; width:14px; height:3px; background:var(--accent); flex:none;}
  h2{font-family:var(--display); font-weight:700; text-transform:uppercase;
    letter-spacing:.015em; font-size:23px; line-height:1.05; margin:0 0 8px; text-wrap:balance;}
  .card p{color:#C6CAD2; margin:0; font-size:13.5px;}
  #tk-labels text{transition:fill .25s ease;}

  /* ---------- variants: every moment type has its own shape ---------- */
  /* cover: editorial, no box, big type over the map */
  .v-cover{background:radial-gradient(ellipse 120% 115% at 35% 40%, var(--carbon-0) 58%, #0A0B0E00 88%);
    border:none; box-shadow:none; max-width:460px !important;
    padding:28px 24px;}
  .v-cover h2{font-size:52px; line-height:.96; letter-spacing:0;}
  .v-cover p{font-size:14.5px; max-width:38ch;}
  .v-cover .kicker::before{width:34px;}

  /* prediction: pit-board green */
  .v-pred{border-color:#1d4a33;}
  .v-pred .kicker{color:var(--green);}
  .v-pred .kicker::before{background:var(--green);}

  /* safety car: hazard stripes, yellow phase */
  .v-sc{border-color:#4a3f10;
    background:linear-gradient(color-mix(in srgb,#EAB308 7%, var(--carbon-1)) 0 100%);}
  .v-sc::before{content:""; position:absolute; top:0; left:0; right:0; height:7px;
    border-radius:6px 6px 0 0;
    background:repeating-linear-gradient(-45deg, var(--yellow) 0 12px, #14151A 12px 24px);}
  .v-sc .kicker{color:var(--yellow);}
  .v-sc .kicker::before{background:var(--yellow);}
  .v-sc h2{color:var(--yellow);}

  /* fastest lap: timing screen */
  .v-fast{border-color:#3d2a55; text-align:left;}
  .v-fast .kicker{color:var(--purple);}
  .v-fast .kicker::before{background:var(--purple);}
  .v-fast .bigtime{font-family:var(--mono); font-weight:700; font-size:44px;
    color:var(--purple); letter-spacing:-.03em; font-variant-numeric:tabular-nums;
    line-height:1; margin:2px 0 8px;}
  .v-fast .bigtime small{font-size:16px; color:var(--muted); font-weight:500;}
  .v-fast h2{font-size:19px; color:var(--ink);}

  /* chequered flag: the finish */
  .v-final{text-align:center; max-width:440px !important; padding-top:26px;}
  .v-final::before, .v-final::after{content:""; position:absolute; left:0; right:0; height:10px;
    background:repeating-conic-gradient(#E6E7EA 0 25%, #101116 0 50%) 0 0/10px 10px;}
  .v-final::before{top:0; border-radius:6px 6px 0 0;}
  .v-final::after{bottom:0; border-radius:0 0 6px 6px;}
  .v-final{padding-bottom:26px;}
  .v-final h2{font-size:36px;}

  /* big-number moment: the stat is the visual */
  .v-num .bignum{position:absolute; right:8px; top:-34px; z-index:-1;
    font-family:var(--display); font-weight:700; font-size:120px; line-height:1;
    color:transparent; -webkit-text-stroke:1.5px var(--accent); opacity:.55;}

  /* share: one-liner, quote style */
  .v-share{text-align:center; border:none; box-shadow:none;
    background:radial-gradient(ellipse 120% 115% at 50% 50%, var(--carbon-0) 58%, #0A0B0E00 88%);
    max-width:460px !important;}
  .v-share h2{font-size:34px; line-height:1.02;}
  .v-share h2::before{content:"“"; display:block; color:var(--accent);
    font-size:64px; line-height:.6; margin-bottom:10px;}
  .v-share p{color:var(--muted); font-family:var(--mono); font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;}

  /* ---------- interactive bits ---------- */
  .opts{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .chip{border:1px solid var(--line); background:var(--carbon-2); color:var(--ink);
    border-radius:4px; padding:12px 16px; font-family:var(--display);
    font-weight:600; font-size:16px; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; text-align:left; transition:border-color .2s; pointer-events:auto;}
  .chip:hover{border-color:var(--muted);}
  .chip:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .chip.right{border-color:var(--green); color:var(--green);}
  .chip.wrong{border-color:var(--line); color:var(--muted); text-decoration:line-through;}
  .verdict{font-family:var(--mono); font-size:12px; color:var(--green);
    margin-top:12px; display:none; letter-spacing:.04em;}
  .dato{background:var(--carbon-0); border:1px solid var(--line); border-radius:4px;
    padding:14px 16px; margin-top:14px; display:none;}
  .dato.open{display:block;}
  .dato b{font-family:var(--mono); font-size:10px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .dato table{width:100%; border-collapse:collapse; margin-top:8px;
    font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums;}
  .dato td{padding:5px 0; border-bottom:1px solid #1C1F26;}
  .dato tr:last-child td{border-bottom:none;}
  .dato td:last-child{text-align:right; font-weight:700;}
  .peek{margin-top:14px; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    color:var(--muted); cursor:pointer; background:none; border:none; padding:0;
    text-transform:uppercase;}
  .peek:hover{color:var(--ink);}
  .peek:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .credits{text-align:center; color:var(--muted); font-family:var(--mono);
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:34px 0 44px;}
  @media (prefers-reduced-motion: reduce){
    .card{transition:none; opacity:1; transform:none;}
  }
</style>
</head>
<body>
<div class="pbar" id="pbar"></div>
<div class="hud">
  <div class="badge">
    <div class="flag"></div>
    <div>
      <div class="t1">British Grand Prix</div>
      <div class="t2">Silverstone · Race · Phase-1 preview</div>
    </div>
  </div>
  <div class="lapbox">
    <span class="lbl">LAP</span>
    <span class="n"><span id="lapnum">0</span><small> / 52</small></span>
  </div>
</div>

<div class="trackwrap">
  <svg id="tracksvg" viewBox="0 0 1000 1000">
    <path id="tk-edge" fill="none" stroke="#464B55" stroke-width="21" stroke-linejoin="round"/>
    <path id="tk-road" fill="none" stroke="var(--carbon-2)" stroke-width="16" stroke-linejoin="round"/>
    <path id="tk-trace" fill="none" stroke="var(--accent)" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round"/>
    <g id="tk-labels"></g>
    <g id="tk-start"></g>
    <g id="tk-car"></g>
  </svg>
</div>
<div class="trackcap">Real track shape · Antonelli's fastest-lap telemetry</div>

<div class="flow" id="flow"></div>

<script src="story_data.js"></script>
<script src="track_data.js"></script>
<script>
(function () {
  const cards = window.STORY.cards;
  const flow = document.getElementById('flow');

  const variant = c => {
    if (c.type === 'cover') return 'v-cover';
    if (c.type === 'share') return 'v-share';
    if (c.type === 'prediction') return 'v-pred';
    const k = (c.kicker || '').toLowerCase();
    if (k.includes('safety')) return 'v-sc';
    if (k.includes('fastest')) return 'v-fast';
    if (k.includes('chequered')) return 'v-final';
    if (k.includes('busiest')) return 'v-num';
    return '';
  };

  const fmtTime = s => {                       // 91.777 -> 1:31.777
    const m = Math.floor(s / 60);
    return m ? `${m}:${(s - m * 60).toFixed(3).padStart(6, '0')}` : s.toFixed(3);
  };

  cards.forEach((c, i) => {
    if (i > 0) flow.insertAdjacentHTML('beforeend', '<div class="spacer"></div>');
    const v = variant(c);
    const stop = document.createElement('div');
    stop.className = 'stop ' + (i % 2 ? 's-right' : 's-left');

    // giant lap numeral behind real race moments
    if (c.type === 'moment' && c.lap > 1)
      stop.insertAdjacentHTML('beforeend', `<div class="biglap">${c.lap}</div>`);

    const div = document.createElement('div');
    div.className = 'card ' + v;
    div.dataset.lap = c.lap ?? 0;

    let html = `<span class="kicker">${c.kicker || ''}</span>`;

    if (v === 'v-fast') {
      // timing-screen: the time itself is the hero
      const m = /([\d.]+)s/.exec(c.title || '');
      const who = (c.title || '').split(':')[0];
      if (m) html += `<div class="bigtime">${fmtTime(+m[1])}<small> · ${who.toUpperCase()}</small></div>`;
      html += `<h2>Fastest lap of the race</h2>`;
    } else {
      html += `<h2>${c.title || ''}</h2>`;
    }

    if (v === 'v-num') {
      const n = /\d+/.exec(c.title || '');
      if (n) html += `<div class="bignum">${n[0]}</div>`;
    }

    if (c.text) html += `<p>${c.text}</p>`;
    if (c.type === 'prediction' && c.options) {
      html += '<div class="opts">' + c.options.map(o =>
        `<button class="chip" data-pick="${o}">${o}</button>`).join('') + '</div>' +
        `<div class="verdict">CALL LOCKED. THE ANSWER IS ON LAP 1.</div>`;
    }
    if (c.dato) {
      const rows = c.dato.rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
      html += `<button class="peek">＋ The data behind this</button>
               <div class="dato"><b>${c.dato.label}</b><table>${rows}</table></div>`;
    }
    if (c.type === 'share') html += `<div class="opts"><button class="chip">Send it to the group chat</button></div>`;
    div.innerHTML = html;
    stop.appendChild(div);
    flow.appendChild(stop);
  });
  flow.insertAdjacentHTML('beforeend',
    '<div class="credits">Built from OpenF1 + FastF1 data · prototype, phase 1</div>');

  flow.querySelectorAll('.chip[data-pick]').forEach(b => b.addEventListener('click', e => {
    const card = e.target.closest('.card');
    const answer = cards.find(c => c.type === 'prediction').answer;
    card.querySelectorAll('.chip[data-pick]').forEach(x => {
      x.classList.add(x.dataset.pick === answer ? 'right' : 'wrong');
      x.disabled = true;
    });
    card.querySelector('.verdict').style.display = 'block';
  }));
  flow.querySelectorAll('.peek').forEach(b => b.addEventListener('click', e => {
    e.target.nextElementSibling.classList.toggle('open');
  }));

  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) en.target.classList.add('seen');
  }), { threshold: 0.25 });
  document.querySelectorAll('.card').forEach(c => io.observe(c));

  // ---------- the real circuit ----------
  const T = window.TRACK;
  const d = 'M ' + T.points.map(p => p[0] + ' ' + p[1]).join(' L ');
  ['tk-edge', 'tk-road', 'tk-trace'].forEach(id =>
    document.getElementById(id).setAttribute('d', d));

  const cx0 = T.points.reduce((s, p) => s + p[0], 0) / T.points.length;
  const cy0 = T.points.reduce((s, p) => s + p[1], 0) / T.points.length;
  const labels = document.getElementById('tk-labels');
  const labelEls = [];
  T.corners.forEach(c => {
    const dx = c.x - cx0, dy = c.y - cy0, m = Math.hypot(dx, dy) || 1;
    const lx = c.x + dx / m * 46, ly = c.y + dy / m * 46;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', lx); t.setAttribute('y', ly);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', '#8B919D');
    t.setAttribute('font-size', '19');
    t.setAttribute('letter-spacing', '2');
    t.setAttribute('style', 'font-family:"JetBrains Mono",monospace;');
    t.textContent = c.label;
    labels.appendChild(t);
    labelEls.push({ t, x: c.x, y: c.y });
  });

  const s0 = T.points[0], s1 = T.points[1];
  const ang0 = Math.atan2(s1[1] - s0[1], s1[0] - s0[0]);
  const nx = Math.cos(ang0 + Math.PI / 2), ny = Math.sin(ang0 + Math.PI / 2);
  const sf = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  sf.setAttribute('x1', s0[0] + nx * 14); sf.setAttribute('y1', s0[1] + ny * 14);
  sf.setAttribute('x2', s0[0] - nx * 14); sf.setAttribute('y2', s0[1] - ny * 14);
  sf.setAttribute('stroke', '#F2F3F5'); sf.setAttribute('stroke-width', '4');
  sf.setAttribute('stroke-dasharray', '4 3');
  document.getElementById('tk-start').appendChild(sf);

  const carG = document.getElementById('tk-car');
  carG.innerHTML = `
    <g>
      <rect x="1" y="1" width="28" height="4.5" rx="1" fill="#23262E"/>
      <rect x="0.5" y="0.5" width="2.6" height="6.5" rx="1" fill="#2E323C"/>
      <rect x="26.9" y="0.5" width="2.6" height="6.5" rx="1" fill="#2E323C"/>
      <path d="M13 5 L17 5 L16.2 22 L13.8 22 Z" fill="#15171D"/>
      <rect x="13.9" y="6.5" width="2.2" height="12" rx="1" fill="#E10600"/>
      <rect x="2.5" y="10.5" width="6.2" height="12.5" rx="2.4" fill="#0D0E11" stroke="#33363E"/>
      <rect x="21.3" y="10.5" width="6.2" height="12.5" rx="2.4" fill="#0D0E11" stroke="#33363E"/>
      <path d="M11 22 L19 22 L21.5 34 L21.5 52 L19 56 L11 56 L8.5 52 L8.5 34 Z" fill="#B9BEC7"/>
      <ellipse cx="15" cy="30.5" rx="4.6" ry="3.6" fill="none" stroke="#3C404A" stroke-width="1.6"/>
      <ellipse cx="15" cy="33.5" rx="3" ry="4.2" fill="#0D0E11"/>
      <rect x="14.3" y="38" width="1.4" height="16" rx="0.7" fill="#23262E"/>
      <rect x="1.8" y="53" width="7.4" height="13.5" rx="2.6" fill="#0D0E11" stroke="#33363E"/>
      <rect x="20.8" y="53" width="7.4" height="13.5" rx="2.6" fill="#0D0E11" stroke="#33363E"/>
      <rect x="4.5" y="69" width="21" height="5" rx="1" fill="#23262E"/>
      <rect x="4.5" y="74.6" width="21" height="1.8" rx="0.9" fill="#15171D"/>
      <rect x="3.6" y="68" width="2.2" height="9.5" rx="1" fill="#2E323C"/>
      <rect x="24.2" y="68" width="2.2" height="9.5" rx="1" fill="#2E323C"/>
    </g>`;

  const cum = [0];
  for (let i = 1; i < T.points.length; i++) {
    const [ax, ay] = T.points[i - 1], [bx, by] = T.points[i];
    cum.push(cum[i - 1] + Math.hypot(bx - ax, by - ay));
  }
  const totalLen = cum[cum.length - 1];
  const trace = document.getElementById('tk-trace');
  trace.setAttribute('stroke-dasharray', totalLen);
  trace.setAttribute('stroke-dashoffset', totalLen);

  function trackPoint(dist) {
    let lo = 0, hi = cum.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; cum[m] < dist ? lo = m + 1 : hi = m; }
    const i = Math.max(1, lo);
    const t = (dist - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
    const [ax, ay] = T.points[i - 1], [bx, by] = T.points[i];
    return { x: ax + (bx - ax) * t, y: ay + (by - ay) * t,
             angle: Math.atan2(by - ay, bx - ax) * 180 / Math.PI + 90 };
  }

  const anchors = [...document.querySelectorAll('.card')]
    .map(c => ({ el: c, lap: +c.dataset.lap }));

  function onScroll() {
    const maxY = document.documentElement.scrollHeight - innerHeight;
    const prog = maxY ? Math.min(1, Math.max(0, scrollY / maxY)) : 0;
    document.getElementById('pbar').style.width = (prog * 100) + '%';

    target = trackPoint(prog * (totalLen - 0.01));
    trace.setAttribute('stroke-dashoffset', totalLen * (1 - prog));
    if (performance.now() - lastTick > 200) {
      cur.x = target.x; cur.y = target.y; cur.angle = target.angle;
      carG.setAttribute('transform',
        `translate(${cur.x} ${cur.y}) rotate(${cur.angle}) scale(0.62) translate(-15 -39)`);
    }

    let nearest = null, nd = 1e9;
    labelEls.forEach(L => {
      const dd = Math.hypot(L.x - target.x, L.y - target.y);
      if (dd < nd) { nd = dd; nearest = L; }
    });
    labelEls.forEach(L => L.t.setAttribute('fill',
      (L === nearest && nd < 130) ? '#F2F3F5' : '#8B919D'));

    const mid = scrollY + innerHeight / 2;
    let best = null, bd = 1e9;
    anchors.forEach(a => {
      const cy = a.el.offsetTop + a.el.offsetHeight / 2;
      const dd = Math.abs(cy - mid);
      if (dd < bd) { bd = dd; best = a.el; }
    });
    anchors.forEach(a => a.el.classList.toggle('dim', a.el !== best));

    const carDocY = scrollY + innerHeight * 0.42;
    let lap = 0;
    for (let i = 0; i < anchors.length; i++) {
      const y = anchors[i].el.offsetTop;
      const next = anchors[i + 1];
      if (!next || carDocY < next.el.offsetTop) {
        if (next) {
          const t = Math.max(0, Math.min(1, (carDocY - y) / (next.el.offsetTop - y)));
          lap = anchors[i].lap + t * (next.lap - anchors[i].lap);
        } else lap = anchors[i].lap;
        if (carDocY >= y) break;
      }
    }
    document.getElementById('lapnum').textContent = Math.max(0, Math.round(lap));
  }

  let target = trackPoint(0);
  const cur = { x: target.x, y: target.y, angle: target.angle };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastTick = 0;
  function tick() {
    lastTick = performance.now();
    const k = reduce ? 1 : 0.16;
    cur.x += (target.x - cur.x) * k;
    cur.y += (target.y - cur.y) * k;
    let da = target.angle - cur.angle;
    da = ((da + 540) % 360) - 180;
    cur.angle += da * k;
    carG.setAttribute('transform',
      `translate(${cur.x} ${cur.y}) rotate(${cur.angle}) scale(0.62) translate(-15 -39)`);
    requestAnimationFrame(tick);
  }

  onScroll(); tick();
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
})();
</script>
</body>
</html>
