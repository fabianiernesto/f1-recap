<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverstone 2026 — scroll the race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --carbon-0:#0A0B0E; --carbon-1:#111318; --carbon-2:#1A1D24;
    --line:#272B33; --ink:#F2F3F5; --muted:#8B919D;
    --accent:#E10600; --purple:#A855F7; --green:#22C55E; --yellow:#EAB308;
    --display:"Barlow Condensed","Arial Narrow",sans-serif;
    --body:"Inter","Segoe UI",sans-serif;
    --mono:"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--carbon-0); color:var(--ink);
    font-family:var(--body); line-height:1.55; font-size:15px;}

  /* ---------- HUD: broadcast lower-third style ---------- */
  .hud{position:fixed; top:0; left:0; right:0; z-index:50; display:flex;
    justify-content:space-between; align-items:stretch; pointer-events:none;
    background:linear-gradient(#0A0B0Ef5 55%,#0A0B0E00);}
  .badge{display:flex; align-items:center; gap:12px; padding:14px 18px;}
  .badge .flag{width:4px; align-self:stretch; background:var(--accent);}
  .badge .t1{font-family:var(--display); font-weight:700; font-size:19px;
    letter-spacing:.04em; text-transform:uppercase; line-height:1;}
  .badge .t2{font-family:var(--mono); font-size:10px; color:var(--muted);
    letter-spacing:.14em; text-transform:uppercase; margin-top:4px;}
  .lapbox{display:flex; align-items:center; padding:14px 18px; gap:10px;}
  .lapbox .lbl{font-family:var(--mono); font-size:10px; color:var(--muted);
    letter-spacing:.14em;}
  .lapbox .n{font-family:var(--mono); font-weight:700; font-size:24px;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
  .lapbox .n small{font-size:13px; color:var(--muted); font-weight:500;}
  .pbar{position:fixed; top:0; left:0; height:2px; background:var(--accent);
    z-index:60; width:0%;}

  /* ---------- track + car ---------- */
  #roadsvg{position:absolute; top:0; left:0; z-index:0; pointer-events:none;}
  #car{position:absolute; z-index:5; width:30px; height:78px; margin:-39px 0 0 -15px;
    pointer-events:none; filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));}

  /* ---------- content ---------- */
  .flow{position:relative; z-index:10; max-width:540px; margin:0 auto;
    padding:110px 20px 60px; display:flex; flex-direction:column;}
  .spacer{height:46vh; flex:none;}
  .card{background:color-mix(in srgb, var(--carbon-1) 94%, transparent);
    backdrop-filter:blur(5px); border:1px solid var(--line); border-radius:6px;
    padding:24px 24px 22px; box-shadow:0 10px 28px rgba(0,0,0,.4);
    opacity:0; transform:translateY(20px); transition:opacity .4s ease-out, transform .4s ease-out;}
  .card.seen{opacity:1; transform:none;}
  .kicker{display:flex; align-items:center; gap:8px; margin-bottom:10px;
    font-family:var(--mono); font-size:10px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--muted);}
  .kicker::before{content:""; width:14px; height:3px; background:var(--accent);}
  .card.k-purple .kicker::before{background:var(--purple);}
  .card.k-yellow .kicker::before{background:var(--yellow);}
  .card.k-green  .kicker::before{background:var(--green);}
  h2{font-family:var(--display); font-weight:700; text-transform:uppercase;
    letter-spacing:.015em; font-size:28px; line-height:1.04; margin:0 0 10px;
    text-wrap:balance;}
  .card p{color:#C6CAD2; margin:0;}
  .opts{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .chip{border:1px solid var(--line); background:var(--carbon-2); color:var(--ink);
    border-radius:4px; padding:12px 16px; font-family:var(--display);
    font-weight:600; font-size:16px; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; text-align:left; transition:border-color .2s;}
  .chip:hover{border-color:var(--muted);}
  .chip:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .chip.right{border-color:var(--green); color:var(--green);}
  .chip.wrong{border-color:var(--line); color:var(--muted); text-decoration:line-through;}
  .verdict{font-family:var(--mono); font-size:12px; color:var(--green);
    margin-top:12px; display:none; letter-spacing:.04em;}
  .dato{background:var(--carbon-0); border:1px solid var(--line); border-radius:4px;
    padding:14px 16px; margin-top:14px; display:none;}
  .dato.open{display:block;}
  .dato b{font-family:var(--mono); font-size:10px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .dato table{width:100%; border-collapse:collapse; margin-top:8px;
    font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums;}
  .dato td{padding:5px 0; border-bottom:1px solid #1C1F26;}
  .dato tr:last-child td{border-bottom:none;}
  .dato td:last-child{text-align:right; font-weight:700;}
  .peek{margin-top:14px; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    color:var(--muted); cursor:pointer; background:none; border:none; padding:0;
    text-transform:uppercase;}
  .peek:hover{color:var(--ink);}
  .peek:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .finish{height:12px; margin:44px -20px 0;
    background:repeating-conic-gradient(#E6E7EA 0 25%, #0A0B0E 0 50%) 0 0/12px 12px;
    opacity:.9;}
  .credits{text-align:center; color:var(--muted); font-family:var(--mono);
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:28px 0 44px;}
  @media (prefers-reduced-motion: reduce){
    .card{transition:none; opacity:1; transform:none;}
  }
</style>
</head>
<body>
<div class="pbar" id="pbar"></div>
<div class="hud">
  <div class="badge">
    <div class="flag"></div>
    <div>
      <div class="t1">British Grand Prix</div>
      <div class="t2">Silverstone · Race · Phase-1 preview</div>
    </div>
  </div>
  <div class="lapbox">
    <span class="lbl">LAP</span>
    <span class="n"><span id="lapnum">0</span><small> / 52</small></span>
  </div>
</div>

<svg id="roadsvg">
  <path id="road-edges" fill="none"></path>
  <path id="road" fill="none"></path>
</svg>

<!-- F1 top view: real proportions (~2.6:1), carbon body, accent nose line -->
<svg id="car" viewBox="0 0 30 78" aria-hidden="true">
  <!-- front wing + endplates -->
  <rect x="1" y="1" width="28" height="4.5" rx="1" fill="#23262E"/>
  <rect x="0.5" y="0.5" width="2.6" height="6.5" rx="1" fill="#2E323C"/>
  <rect x="26.9" y="0.5" width="2.6" height="6.5" rx="1" fill="#2E323C"/>
  <!-- nose -->
  <path d="M13 5 L17 5 L16.2 22 L13.8 22 Z" fill="#15171D"/>
  <rect x="13.9" y="6.5" width="2.2" height="12" rx="1" fill="#E10600"/>
  <!-- front suspension -->
  <path d="M8 14 L14 17 M22 14 L16 17" stroke="#2E323C" stroke-width="1.2"/>
  <!-- front tyres -->
  <rect x="2.5" y="10.5" width="6.2" height="12.5" rx="2.4" fill="#0D0E11" stroke="#33363E" stroke-width="1"/>
  <rect x="21.3" y="10.5" width="6.2" height="12.5" rx="2.4" fill="#0D0E11" stroke="#33363E" stroke-width="1"/>
  <circle cx="5.6" cy="16.7" r="1.5" fill="#3C404A"/>
  <circle cx="24.4" cy="16.7" r="1.5" fill="#3C404A"/>
  <!-- monocoque + sidepods -->
  <path d="M11 22 L19 22 L21.5 34 L21.5 52 L19 56 L11 56 L8.5 52 L8.5 34 Z" fill="#1B1E25"/>
  <path d="M8.5 34 L5.8 37 L5.8 50 L8.5 52 Z" fill="#15171D"/>
  <path d="M21.5 34 L24.2 37 L24.2 50 L21.5 52 Z" fill="#15171D"/>
  <!-- halo -->
  <ellipse cx="15" cy="30.5" rx="4.6" ry="3.6" fill="none" stroke="#3C404A" stroke-width="1.6"/>
  <rect x="14.4" y="26" width="1.2" height="4" fill="#3C404A"/>
  <!-- cockpit + helmet -->
  <ellipse cx="15" cy="33.5" rx="3" ry="4.2" fill="#0D0E11"/>
  <circle cx="15" cy="33" r="2" fill="#4A4F5A"/>
  <!-- engine cover spine -->
  <rect x="14.3" y="38" width="1.4" height="16" rx="0.7" fill="#23262E"/>
  <!-- rear tyres (wider) -->
  <rect x="1.8" y="53" width="7.4" height="13.5" rx="2.6" fill="#0D0E11" stroke="#33363E" stroke-width="1"/>
  <rect x="20.8" y="53" width="7.4" height="13.5" rx="2.6" fill="#0D0E11" stroke="#33363E" stroke-width="1"/>
  <circle cx="5.5" cy="59.7" r="1.7" fill="#3C404A"/>
  <circle cx="24.5" cy="59.7" r="1.7" fill="#3C404A"/>
  <!-- rear wing + DRS flap + endplates -->
  <rect x="4.5" y="69" width="21" height="5" rx="1" fill="#23262E"/>
  <rect x="4.5" y="74.6" width="21" height="1.8" rx="0.9" fill="#15171D"/>
  <rect x="3.6" y="68" width="2.2" height="9.5" rx="1" fill="#2E323C"/>
  <rect x="24.2" y="68" width="2.2" height="9.5" rx="1" fill="#2E323C"/>
</svg>

<div class="flow" id="flow"></div>

<script src="story_data.js"></script>
<script>
(function () {
  const cards = window.STORY.cards;
  const flow = document.getElementById('flow');

  // semantic kicker colors, timing-screen style
  const tone = c => {
    const k = (c.kicker || '').toLowerCase();
    if (k.includes('fastest')) return 'k-purple';
    if (k.includes('safety')) return 'k-yellow';
    if (c.type === 'prediction') return 'k-green';
    return '';
  };

  cards.forEach((c, i) => {
    if (i > 0) flow.insertAdjacentHTML('beforeend', '<div class="spacer"></div>');
    const div = document.createElement('div');
    div.className = 'card ' + tone(c);
    div.dataset.lap = c.lap ?? 0;
    let html = `<span class="kicker">${c.kicker || ''}</span><h2>${c.title || ''}</h2>`;
    if (c.text) html += `<p>${c.text}</p>`;
    if (c.type === 'prediction' && c.options) {
      html += '<div class="opts">' + c.options.map(o =>
        `<button class="chip" data-pick="${o}">${o}</button>`).join('') + '</div>' +
        `<div class="verdict">CALL LOCKED. THE ANSWER IS ON LAP 1.</div>`;
    }
    if (c.dato) {
      const rows = c.dato.rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
      html += `<button class="peek">＋ The data behind this</button>
               <div class="dato"><b>${c.dato.label}</b><table>${rows}</table></div>`;
    }
    if (c.type === 'share') html += `<div class="opts"><button class="chip">Send it to the group chat</button></div>`;
    div.innerHTML = html;
    flow.appendChild(div);
  });
  flow.insertAdjacentHTML('beforeend',
    '<div class="finish"></div><div class="credits">Built from OpenF1 timing data · prototype, phase 1</div>');

  flow.querySelectorAll('.chip[data-pick]').forEach(b => b.addEventListener('click', e => {
    const card = e.target.closest('.card');
    const answer = cards.find(c => c.type === 'prediction').answer;
    card.querySelectorAll('.chip[data-pick]').forEach(x => {
      x.classList.add(x.dataset.pick === answer ? 'right' : 'wrong');
      x.disabled = true;
    });
    card.querySelector('.verdict').style.display = 'block';
  }));
  flow.querySelectorAll('.peek').forEach(b => b.addEventListener('click', e => {
    e.target.nextElementSibling.classList.toggle('open');
  }));

  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) en.target.classList.add('seen');
  }), { threshold: 0.25 });
  document.querySelectorAll('.card').forEach(c => io.observe(c));

  // ---------- road: asphalt with white edge lines (no highway dashes) ----------
  const svg = document.getElementById('roadsvg');
  const road = document.getElementById('road');
  const edges = document.getElementById('road-edges');
  const car = document.getElementById('car');
  let samples = [];

  function buildRoad() {
    const H = document.documentElement.scrollHeight;
    const W = document.documentElement.clientWidth;
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    const cx = W / 2, amp = Math.min(W * 0.30, 230), seg = 620;
    let d = `M ${cx} 0`, y = 0, side = 1;
    while (y < H) {
      const y2 = Math.min(y + seg, H);
      d += ` C ${cx + amp * side} ${y + seg * 0.35}, ${cx + amp * side} ${y2 - seg * 0.35}, ${cx} ${y2}`;
      y = y2; side = -side;
    }
    // edge lines: white path slightly wider than the asphalt on top of it
    edges.setAttribute('d', d);
    edges.setAttribute('stroke', '#5A5F6A'); edges.setAttribute('stroke-width', 62);
    road.setAttribute('d', d);
    road.setAttribute('stroke', 'var(--carbon-2)'); road.setAttribute('stroke-width', 58);
    const len = road.getTotalLength();
    samples = [];
    for (let i = 0; i <= len; i += 5) samples.push(road.getPointAtLength(i));
  }

  function pointAtY(y) {
    let lo = 0, hi = samples.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; samples[m].y < y ? lo = m + 1 : hi = m; }
    const p = samples[lo], q = samples[Math.min(lo + 2, samples.length - 1)];
    return { p, angle: Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + 90 };
  }

  const anchors = [...document.querySelectorAll('.card')]
    .map(c => ({ el: c, lap: +c.dataset.lap }));

  function onScroll() {
    const maxY = document.documentElement.scrollHeight - innerHeight;
    const prog = maxY ? Math.min(1, scrollY / maxY) : 0;
    document.getElementById('pbar').style.width = (prog * 100) + '%';

    const carDocY = scrollY + innerHeight * 0.42;
    if (samples.length) {
      const { p, angle } = pointAtY(carDocY);
      car.style.left = p.x + 'px';
      car.style.top = p.y + 'px';
      car.style.transform = `rotate(${angle}deg)`;
    }
    let lap = 0;
    for (let i = 0; i < anchors.length; i++) {
      const y = anchors[i].el.offsetTop;
      const next = anchors[i + 1];
      if (!next || carDocY < next.el.offsetTop) {
        if (next) {
          const t = Math.max(0, Math.min(1, (carDocY - y) / (next.el.offsetTop - y)));
          lap = anchors[i].lap + t * (next.lap - anchors[i].lap);
        } else lap = anchors[i].lap;
        if (carDocY >= y) break;
      }
    }
    document.getElementById('lapnum').textContent = Math.max(0, Math.round(lap));
  }

  buildRoad(); onScroll();
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', () => { buildRoad(); onScroll(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildRoad(); onScroll(); });
})();
</script>
</body>
</html>
